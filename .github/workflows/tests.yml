name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - Feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile (src + test)
        run: |
          rm -rf bin
          mkdir -p bin
          javac -d bin -cp "lib/*" $(find src -name "*.java") $(find test -name "*.java")

      - name: Run JUnit (RangeTestSuite)
        run: |
          java -jar lib/junit-platform-console-standalone-6.0.3.jar \
            -cp "bin:lib/*" \
            --select-class org.jfree.data.RangeTestSuite
